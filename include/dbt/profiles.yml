# Profil dbt utilisé par le DAG (local et conteneur Astro).
# Tout est lu dans l'environnement : aucun chemin ni secret en dur.
job_market_dbt:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET') }}"
      location: US
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4

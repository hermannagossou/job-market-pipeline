version: 2

models:
  - name: int_france_travail_merge_ville
    description: "{{ doc('int_france_travail_merge_ville') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null

  - name: int_france_travail_nom_metier
    description: "{{ doc('int_france_travail_nom_metier') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: nom_metier
        description: "Métier extrait par regex — NULL si aucun match (partira vers Gemini)"
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Analyst', 'Data Scientist', 'Machine Learning Engineer', 'Analytics Engineer', 'Data Architect', 'Business Intelligence Analyst', 'Data Product Manager', 'Chief Data Officer', 'Data Steward', 'Data Manager', 'Dataops Engineer', 'Mlops Engineer']
      - name: description
        description: "Description complète du poste, conservée pour transmission à Gemini si besoin"
        data_tests:
          - not_null

  - name: int_france_travail_ai_nom_metier
    description: "{{ doc('int_france_travail_ai_nom_metier') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: nom_metier
        description: "Métier classifié par Gemini Flash parmi les 13 métiers définis, ou 'Non Renseigné'"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Analyst', 'Data Scientist', 'Machine Learning Engineer', 'Analytics Engineer', 'Data Architect', 'Business Intelligence Analyst', 'Data Product Manager', 'Chief Data Officer', 'Data Steward', 'Data Manager', 'Dataops Engineer', 'Mlops Engineer', 'Non Renseigné']

  - name: int_france_travail_nom_metier_finale
    description: "{{ doc('int_france_travail_nom_metier_finale') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: nom_metier
        description: "Métier final après fusion regex + Gemini — COALESCE(regex, Gemini)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Analyst', 'Data Scientist', 'Machine Learning Engineer', 'Analytics Engineer', 'Data Architect', 'Business Intelligence Analyst', 'Data Product Manager', 'Chief Data Officer', 'Data Steward', 'Data Manager', 'Dataops Engineer', 'Mlops Engineer', 'Non Renseigné']

  - name: int_france_travail_ai_nom_entreprise
    description: "{{ doc('int_france_travail_ai_nom_entreprise') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: nom_entreprise
        description: "Nom d'entreprise extrait par Gemini depuis la description, ou 'Non Renseigné'"
        data_tests:
          - not_null

  - name: int_france_travail_ai_nom_secteur
    description: "{{ doc('int_france_travail_ai_nom_secteur') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: nom_secteur
        description: "Secteur d'activité classifié par Gemini parmi les 15 secteurs définis"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Banque & Finance', 'Assurance', 'Télécommunications', 'Retail & E-Commerce', 'Industrie & Manufacturing', 'Santé & Pharmaceutique', 'Conseil & Esn', 'Média & Divertissement', 'Logistique & Transport', 'Énergie & Environnement', 'Immobilier & Construction', 'Éducation & Recherche', 'Administration Publique', 'Startup & Tech', 'Autre']

  - name: int_france_travail_ai_type_contrat
    description: "{{ doc('int_france_travail_ai_type_contrat') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: type_contrat_ia
        description: "Type de contrat classifié par Gemini Flash : CDI, CDD, Stage, Alternance, Freelance, Intérim, ou 'Non Renseigné'"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CDI', 'CDD', 'Stage', 'Alternance', 'Freelance', 'Intérim', 'Non Renseigné']

  - name: int_france_travail_type_contrat
    description: "{{ doc('int_france_travail_type_contrat') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: type_contrat
        description: "Type de contrat normalisé : priorité à Gemini, fallback sur le champ API normalisé"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CDI', 'CDD', 'Stage', 'Alternance', 'Freelance', 'Intérim', 'Non Renseigné']

  - name: int_france_travail_ai_niveau_experience
    description: "{{ doc('int_france_travail_ai_niveau_experience') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: niveau_experience_ia
        description: "Nombre d'années d'expérience exigées du candidat, extrait par Gemini Flash depuis la description, ou 'Non Renseigné'"
        data_tests:
          - not_null

  - name: int_france_travail_niveau_experience
    description: "{{ doc('int_france_travail_niveau_experience') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: niveau_experience
        description: "Niveau d'expérience classifié : Junior, Confirmé, Senior, Expert ou Non Renseigné"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Junior', 'Confirmé', 'Senior', 'Expert', 'Non Renseigné']

  - name: int_france_travail_ai_niveau_formation
    description: "{{ doc('int_france_travail_ai_niveau_formation') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: niveau_formation_ia
        description: "Niveau de formation minimum classifié par Gemini Flash : Bac+2, Bac+3, Bac+4, Bac+5, Doctorat, ou 'Non Renseigné'"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bac+2', 'Bac+3', 'Bac+4', 'Bac+5', 'Doctorat', 'Non Renseigné']

  - name: int_france_travail_niveau_formation
    description: "{{ doc('int_france_travail_niveau_formation') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: niveau_formation
        description: "Niveau de formation le plus élevé requis : Bac+2 à Bac+5, Doctorat, ou Non Renseigné"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bac+2', 'Bac+3', 'Bac+4', 'Bac+5', 'Doctorat', 'Non Renseigné']

  - name: int_france_travail_salaire
    description: "{{ doc('int_france_travail_salaire') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: salaire_min
        description: "Salaire minimum annuel brut en euros (déclaré ou imputé par médiane)"
        data_tests:
          - not_null
      - name: salaire_max
        description: "Salaire maximum annuel brut en euros (déclaré ou imputé par médiane, toujours ≥ salaire_min)"
        data_tests:
          - not_null
      - name: statut_salaire
        description: "Origine du salaire : Déclaré (fourni), Incomplet (partiel), Estimé (imputé)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Estimé', 'Déclaré', 'Incomplet']

  - name: int_france_travail_localisation
    description: "{{ doc('int_france_travail_localisation') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: ville
        description: "Nom de la ville résolu (libellé le plus précis entre API et INSEE)"
      - name: departement
        description: "Nom du département résolu"
      - name: region
        description: "Nom de la région résolue"

  - name: int_france_travail_offres
    description: "{{ doc('int_france_travail_offres') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: nom_metier
        description: "Métier data validé (les 'Non Renseigné' ont été filtrés)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Analyst', 'Data Scientist', 'Machine Learning Engineer', 'Analytics Engineer', 'Data Architect', 'Business Intelligence Analyst', 'Data Product Manager', 'Chief Data Officer', 'Data Steward', 'Data Manager', 'Dataops Engineer', 'Mlops Engineer']
      - name: nom_entreprise
        description: "Nom de l'entreprise (API en priorité, Gemini en fallback pour les anonymes)"
        data_tests:
          - not_null
      - name: type_contrat
        description: "Type de contrat normalisé"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CDI', 'CDD', 'Stage', 'Alternance', 'Freelance', 'Intérim', 'Non Renseigné']
      - name: niveau_formation
        description: "Niveau de formation le plus élevé requis"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bac+2', 'Bac+3', 'Bac+4', 'Bac+5', 'Doctorat', 'Non Renseigné']
      - name: niveau_experience
        description: "Niveau d'expérience classifié"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Junior', 'Confirmé', 'Senior', 'Expert', 'Non Renseigné']
      - name: ville
        description: "Nom de la ville (vaut 'Non Renseigné' si non résolu)"
        data_tests:
          - not_null
      - name: departement
        description: "Nom du département (les offres sans département sont filtrées en sortie)"
        data_tests:
          - not_null
      - name: region
        description: "Nom de la région"
        data_tests:
          - not_null
      - name: salaire_min
        description: "Salaire minimum annuel brut en euros"
        data_tests:
          - not_null
      - name: salaire_max
        description: "Salaire maximum annuel brut en euros"
        data_tests:
          - not_null
      - name: statut_salaire
        description: "Origine du salaire : Déclaré, Incomplet ou Estimé"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Estimé', 'Déclaré', 'Incomplet']
      - name: nom_secteur
        description: "Secteur d'activité classifié par Gemini"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Banque & Finance', 'Assurance', 'Télécommunications', 'Retail & E-Commerce', 'Industrie & Manufacturing', 'Santé & Pharmaceutique', 'Conseil & Esn', 'Média & Divertissement', 'Logistique & Transport', 'Énergie & Environnement', 'Immobilier & Construction', 'Éducation & Recherche', 'Administration Publique', 'Startup & Tech', 'Autre']
      - name: date_publication
        description: "Date de publication de l'offre"
        data_tests:
          - not_null
      - name: nom_plateforme
        description: "Plateforme source de l'offre"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['France Travail', 'Welcome To The Jungle']
      - name: nbre_postes
        description: "Nombre de postes à pourvoir"
        data_tests:
          - not_null

  - name: int_france_travail_offres_competences
    description: "{{ doc('int_france_travail_offres_competences') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id, competence]
    columns:
      - name: id
        description: "Identifiant de l'offre"
        data_tests:
          - not_null
      - name: competence
        description: "Compétence technique extraite et validée contre le seed (ex : Python, dbt, Spark)"
        data_tests:
          - not_null
      - name: nom_plateforme
        description: "Plateforme source de l'offre"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['France Travail', 'Welcome To The Jungle']

  - name: int_france_travail_ai_langues
    description: "{{ doc('int_france_travail_ai_langues') }}"
    columns:
      - name: id
        description: "Identifiant unique de l'offre (clé primaire)"
        data_tests:
          - unique
          - not_null
      - name: langues_ia
        description: "Langues exigées du candidat classifiées par Gemini Flash, séparées par une virgule (ex. 'Français, Anglais'), ou 'Non Renseigné'"
        data_tests:
          - not_null

  - name: int_france_travail_offres_langues
    description: "{{ doc('int_france_travail_offres_langues') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id, langue]
    columns:
      - name: id
        description: "Identifiant de l'offre"
        data_tests:
          - not_null
      - name: langue
        description: "Langue extraite depuis l'API ou la description de l'offre, ou 'Non Renseigné'"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [
                  'Anglais', 'Français', 'Espagnol', 'Allemand', 'Italien',
                  'Portugais', 'Chinois', 'Mandarin', 'Japonais', 'Arabe',
                  'Néerlandais', 'Hollandais', 'Russe', 'Coréen', 'Turc',
                  'Polonais', 'Suédois', 'Danois', 'Norvégien', 'Finnois',
                  'Hindi', 'Non Renseigné'
                ]
      - name: nom_plateforme
        description: "Plateforme source de l'offre"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['France Travail', 'Welcome To The Jungle']
